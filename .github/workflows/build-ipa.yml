# 触发任意 push（含 workflow_dispatch 手动触发），在 macOS 云端编译出未签名 IPA
name: Build IPA

on:
  push:
    branches: [main, master]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'project.yml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Release)
        run: |
          xcodebuild -project Embers.xcodeproj \
            -scheme Embers \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build for simulator (smoke test)
        run: |
          xcodebuild -project Embers.xcodeproj \
            -scheme Embers \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath buildsim build

      - name: Launch on simulator & capture logs
        run: |
          set -e
          DEV=$(xcrun simctl list devices available | grep -E 'iPhone (16|15|14)' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device: $DEV"
          xcrun simctl boot "$DEV" 2>/dev/null || true
          xcrun simctl bootstatus "$DEV" -b 2>/dev/null || true
          xcrun simctl install "$DEV" "buildsim/Build/Products/Debug-iphonesimulator/Embers.app"
          (xcrun simctl launch --console-pty "$DEV" com.guanjin.embers > embers-stdout.log 2>&1 &) || true
          sleep 9
          xcrun simctl spawn "$DEV" log show --last 30s --predicate 'processImagePath CONTAINS "Embers"' --style compact > embers-app.log 2>&1 || true
          xcrun simctl io "$DEV" screenshot embers-screen.png
          echo "--- app stdout ---"
          cat embers-stdout.log 2>/dev/null || true
          echo "--- system log grep DIAG ---"
          grep -a 'DIAG' embers-app.log 2>/dev/null || true

      - name: Upload logs & smoke-test screenshot
        uses: actions/upload-artifact@v4
        with:
          name: embers-diagnostics
          path: |
            embers-stdout.log
            embers-app.log
            embers-screen.png
          if-no-files-found: warn

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Embers.app" Payload/
          zip -r -y "Embers-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Embers-unsigned-ipa
          path: Embers-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Print size
        run: ls -lh Embers-unsigned.ipa